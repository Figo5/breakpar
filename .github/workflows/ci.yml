name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: breakpar
          POSTGRES_PASSWORD: breakpar
          POSTGRES_DB: breakpar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U breakpar -d breakpar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://breakpar:breakpar@localhost:5432/breakpar
      DIRECT_URL: postgresql://breakpar:breakpar@localhost:5432/breakpar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Career database tests
        run: npm run test:career-db

      - name: Engine calibration (break-par band gate)
        run: npm run engine:calibrate

      - name: Production build
        run: npm run build
        env:
          # Dummy values so the build can prerender without real secrets.
          # (Dynamic pages never touch the DB at build time.)
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci_dummy_secret
          SERVER_SEED: ci-dummy-seed
